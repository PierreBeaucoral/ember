<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" role="img" aria-labelledby="t d">
  <title id="t">Ember Workspace layout</title>
  <desc id="d">Top bar with the Ember logo, breadcrumb, search field, usage meter, Layout menu and Resume; sidebar with New chat, project filter, projects and chats with turn counts, and Add-ons, Theme, Alerts, Quit at the bottom; the conversation with folded turn summaries above a docked terminal; an inspector with Plan, Usage, Output, Files and Config tabs, showing the plan checklist.</desc>
  <style>
    .bg { fill: #faf7f2 } .win { fill: #f2eee7; stroke: #d9d2c7 } .pane { fill: #ffffff; stroke: #e0d9cf }
    .h { fill: #20242b } .t { fill: #5b5f66 } .line { fill: #e9e4dc } .term { fill: #20242b } .termt { fill: #d6d2cc }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #191b20 } .win { fill: #20242b; stroke: #393d44 } .pane { fill: #292d34; stroke: #393d44 }
      .h { fill: #f3efe9 } .t { fill: #a9adb4 } .line { fill: #393d44 } .term { fill: #121418 }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace }
    .h { font-size: 17px; font-weight: 700; letter-spacing: 1.5px }
    .t { font-size: 15px }
  </style>
  <rect class="bg" width="1280" height="660" rx="24"/>
  <!-- window chrome -->
  <rect class="win" x="32" y="28" width="1216" height="604" rx="16"/>
  <circle cx="60" cy="54" r="7" fill="#ec6a5e"/><circle cx="84" cy="54" r="7" fill="#f4bf4f"/><circle cx="108" cy="54" r="7" fill="#61c554"/>
  <text x="640" y="60" text-anchor="middle" class="t">Ember</text>

  <!-- top bar: logo (Home), breadcrumb, search / palette, usage meter, Layout, Resume -->
  <rect class="pane" x="48" y="72" width="1184" height="44" rx="10"/>
  <rect x="60" y="80" width="28" height="28" rx="7" fill="#dd876d"/>
  <path d="M67 88 l6 6 -6 6 M77 100 h8" stroke="#20242b" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="98" y="100" class="h" letter-spacing="0">Ember</text>
  <text x="180" y="99" class="t">my-paper / Event study</text>
  <rect class="line" x="452" y="82" width="376" height="24" rx="6"/>
  <text x="466" y="99" class="t mono" style="font-size:14px">⌘K  Search chats, files…</text>
  <rect class="line" x="866" y="90" width="72" height="8" rx="4"/>
  <rect x="866" y="90" width="22" height="8" rx="4" fill="#dd876d"/>
  <text x="948" y="99" class="t">11%</text>
  <text x="1030" y="99" class="t">Layout</text>
  <rect x="1124" y="81" width="96" height="26" rx="6" fill="#dd876d"/>
  <text x="1172" y="99" text-anchor="middle" class="t" style="fill:#20242b;font-weight:600">Resume</text>

  <!-- sidebar -->
  <rect class="pane" x="48" y="128" width="220" height="488" rx="10"/>
  <rect x="60" y="140" width="196" height="28" rx="6" fill="#dd876d"/>
  <text x="158" y="159" text-anchor="middle" class="t" style="fill:#20242b;font-weight:600">+ New chat</text>
  <rect class="line" x="60" y="176" width="196" height="26" rx="6"/>
  <text x="70" y="194" class="t" style="font-size:14px">Filter projects</text>
  <text x="246" y="194" text-anchor="end" class="t mono" style="font-size:13px">⌘K</text>
  <text x="60" y="232" class="h" style="font-size:13px">PROJECTS</text>
  <circle cx="68" cy="252" r="4" fill="#3fb950"/>
  <text x="80" y="257" class="t">my-paper</text>
  <text x="246" y="257" text-anchor="end" class="t">6</text>
  <rect x="60" y="270" width="196" height="46" rx="6" fill="#dd876d" opacity=".18"/>
  <rect x="60" y="270" width="2" height="46" fill="#dd876d"/>
  <text x="80" y="289" class="t">Event study</text>
  <text x="80" y="308" class="t" style="font-size:13px">live · 14 turns</text>
  <text x="80" y="341" class="t">Clean data</text>
  <text x="80" y="360" class="t" style="font-size:13px">Oct 1 · 22 turns</text>
  <text x="80" y="402" class="t">dotfiles</text>
  <text x="246" y="402" text-anchor="end" class="t">3</text>
  <rect class="line" x="60" y="578" width="196" height="1"/>
  <text x="60" y="602" class="t" style="font-size:14px">Add-ons</text>
  <text x="122" y="602" class="t" style="font-size:14px">Theme</text>
  <text x="174" y="602" class="t" style="font-size:14px">Alerts</text>
  <text x="224" y="602" class="t" style="font-size:14px">Quit</text>

  <!-- conversation -->
  <rect class="pane" x="280" y="128" width="580" height="296" rx="10"/>
  <text x="298" y="152" class="t" style="font-size:13px">my-paper</text>
  <text x="298" y="174" class="h" letter-spacing="0">Event study</text>
  <text x="586" y="170" class="t" style="font-size:14px">Export</text>
  <text x="640" y="170" class="t" style="font-size:14px">Context</text>
  <rect x="710" y="152" width="136" height="26" rx="6" fill="#dd876d"/>
  <text x="778" y="170" text-anchor="middle" class="t" style="fill:#20242b;font-weight:600;font-size:14px">Resume in terminal</text>
  <text x="298" y="198" class="t" style="font-size:13px">live · Opus · Output 41k · Peak context 92k · cache 4:12</text>
  <rect class="line" x="298" y="210" width="260" height="24" rx="6"/>
  <rect x="298" y="210" width="92" height="24" rx="6" fill="#dd876d" opacity=".18"/>
  <text x="344" y="227" text-anchor="middle" class="t" style="font-size:14px">Everything</text>
  <text x="474" y="227" text-anchor="middle" class="t" style="font-size:14px">Prompts and answers</text>
  <text x="576" y="227" class="t" style="font-size:14px">View</text>
  <rect class="line" x="298" y="246" width="544" height="1"/>
  <!-- turn 1 -->
  <text x="298" y="270" class="t" style="fill:#dd876d;font-weight:700">You</text>
  <text x="340" y="270" class="t">estimate the event study</text>
  <rect class="line" x="298" y="280" width="544" height="24" rx="4"/>
  <text x="310" y="297" class="t" style="font-size:14px">› Read 3 files, edited 2, ran 3 commands · 12 steps · 3m 12s</text>
  <text x="298" y="328" class="t" style="font-weight:700">Claude</text>
  <rect class="line" x="356" y="319" width="420" height="10" rx="5"/>
  <rect class="line" x="356" y="337" width="300" height="10" rx="5"/>
  <!-- turn 2 -->
  <text x="298" y="372" class="t" style="fill:#dd876d;font-weight:700">You</text>
  <text x="340" y="372" class="t">write the results section</text>
  <rect class="line" x="298" y="382" width="544" height="24" rx="4"/>
  <text x="310" y="399" class="t" style="font-size:14px">› Edited paper.tex · 4 steps · 48s</text>

  <!-- terminal, docked below the conversation -->
  <rect class="term" x="280" y="436" width="580" height="180" rx="10"/>
  <text x="298" y="464" class="h" fill="#dd876d" style="fill:#dd876d">TERMINAL</text>
  <text x="842" y="464" text-anchor="end" class="termt" font-size="15" opacity=".7">Hide</text>
  <text x="298" y="498" class="termt mono" font-size="15">$ claude --resume 1ce2d4d8</text>
  <text x="298" y="526" class="termt mono" font-size="15" opacity=".7">✻ Welcome back! Resuming session…</text>
  <text x="298" y="554" class="termt mono" font-size="15" opacity=".7">&gt; write the chart to $CLAUDE_DEVTOOLS_VIZ_DIR</text>
  <rect x="298" y="570" width="10" height="18" fill="#dd876d"><animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></rect>

  <!-- inspector: tabs, Plan tab open -->
  <rect class="pane" x="872" y="128" width="360" height="488" rx="10"/>
  <text x="890" y="156" class="t" style="font-weight:700">Plan</text>
  <rect x="890" y="164" width="32" height="2" fill="#dd876d"/>
  <text x="940" y="156" class="t">Usage</text>
  <text x="998" y="156" class="t">Output</text>
  <text x="1064" y="156" class="t">Files</text>
  <text x="1116" y="156" class="t">Config</text>
  <text x="1214" y="156" text-anchor="end" class="t" style="font-size:14px">Hide</text>
  <rect class="line" x="872" y="166" width="360" height="1"/>
  <text x="890" y="198" class="t mono" style="font-size:14px">.claude/plan.md · 2 of 5</text>
  <rect class="line" x="890" y="210" width="324" height="8" rx="4"/>
  <rect x="890" y="210" width="130" height="8" rx="4" fill="#dd876d"/>
  <g stroke="#dd876d" stroke-width="2">
    <rect x="890" y="242" width="16" height="16" rx="3" fill="#dd876d"/>
    <rect x="890" y="278" width="16" height="16" rx="3" fill="#dd876d"/>
    <rect x="890" y="314" width="16" height="16" rx="3" fill="#dd876d" fill-opacity=".35"/>
    <rect x="890" y="350" width="16" height="16" rx="3" fill="none"/>
    <rect x="890" y="386" width="16" height="16" rx="3" fill="none"/>
  </g>
  <path d="M894 250 l3 3 6 -7 M894 286 l3 3 6 -7" stroke="#20242b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="918" y="255" class="t" opacity=".7">clean the panel data</text>
  <text x="918" y="291" class="t" opacity=".7">build treatment dates</text>
  <text x="918" y="327" class="t">estimate event study</text>
  <text x="918" y="363" class="t">robustness checks</text>
  <text x="918" y="399" class="t">write results section</text>
  <text x="890" y="444" class="t" opacity=".8">ticks write back to .claude/plan.md</text>
  <text x="890" y="602" class="t" style="font-size:14px" opacity=".8">open · Retrospective</text>
</svg>
