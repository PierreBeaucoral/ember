# Builds the desktop apps and attaches them to the GitHub release.
#   push a tag vX.Y.Z  → build, smoke-test, upload to that release (created if
#                        missing)
#   Run workflow (Actions tab) → build and smoke-test only; the zips are kept
#                        as workflow artifacts for a week (a dry run)
# Unsigned (signing is paid): macOS asks once in Privacy & Security, Windows
# SmartScreen says "More info → Run anyway". The README says so.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  macos:
    strategy:
      matrix:
        include:
          - {runner: macos-latest, arch: arm64}
          - {runner: macos-15-intel, arch: x86_64}   # Intel Macs
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # a tag must match server.py's VERSION (the apps report it and compare it
      # with the latest release): v1.2.1 once shipped saying 1.2.0. Failing
      # here stops publish, which needs this job.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(sed -n 's/^VERSION = "\([^"]*\)".*/\1/p' server.py)
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME but server.py has VERSION = $v"; exit 1; }
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 -m pip install Pillow      # the app icon
      - run: bash packaging/macos/build-app.sh dist
      - run: python3 tools/smoke_app.py macapp dist/Ember.app
      # the usual "drag Ember to Applications" window
      - run: |
          mkdir dmg && ditto dist/Ember.app dmg/Ember.app && ln -s /Applications dmg/Applications
          hdiutil create -volname Ember -srcfolder dmg -format UDZO -o Ember-macos-${{ matrix.arch }}.dmg
      - uses: actions/upload-artifact@v4
        with: {name: "macos-${{ matrix.arch }}", path: "Ember-macos-${{ matrix.arch }}.dmg", retention-days: 7}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install pyinstaller pywebview
      - run: python packaging/pyinstaller/build.py
      - run: python tools/smoke_app.py frozen dist/Ember/Ember.exe
      # the WebView2 window itself, from files marked "downloaded from the
      # internet" as in a user's unzipped copy (it used to fall back to the
      # browser there); blocking: a release without its window is broken
      - run: python tools/smoke_app.py window dist/Ember/Ember.exe
        timeout-minutes: 3
      - shell: pwsh
        run: Compress-Archive -Path dist/Ember -DestinationPath Ember-windows-x64.zip
      # the installer (Start menu, uninstaller); the zip stays as the portable copy
      - shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $v = (Select-String -Path server.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          iscc /Qp "/DVersion=$v" packaging\windows\ember.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Move-Item dist\Ember-Setup-x64.exe .
      # silent per-user install, then the installed copy must run
      - shell: pwsh
        run: |
          Start-Process -Wait .\Ember-Setup-x64.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          python tools/smoke_app.py frozen "$env:LOCALAPPDATA\Programs\Ember\Ember.exe"
      - uses: actions/upload-artifact@v4
        with: {name: windows, path: "Ember-windows-x64.zip\nEmber-Setup-x64.exe", retention-days: 7}

  linux:
    # the oldest supported runner: its glibc sets the oldest distro that runs it
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          sudo apt-get update
          sudo apt-get install -y libgirepository1.0-dev libcairo2-dev pkg-config \
            gir1.2-webkit2-4.1 xvfb
      # PyGObject 3.51+ needs girepository-2.0, which 22.04 does not have
      - run: python -m pip install pyinstaller pywebview "PyGObject<3.51" pycairo
      - run: python packaging/pyinstaller/build.py
      - run: python tools/smoke_app.py frozen dist/Ember/Ember
      - run: xvfb-run -a python tools/smoke_app.py window dist/Ember/Ember
        continue-on-error: true
        timeout-minutes: 3
      - run: tar -czf Ember-linux-x86_64.tar.gz -C dist Ember
      - run: bash packaging/linux/build-appimage.sh && mv dist/Ember-linux-x86_64.AppImage .
      - run: python tools/smoke_app.py frozen Ember-linux-x86_64.AppImage
        env: {APPIMAGE_EXTRACT_AND_RUN: "1"}    # no FUSE on runners
      - uses: actions/upload-artifact@v4
        with: {name: linux, path: "Ember-linux-x86_64.tar.gz\nEmber-linux-x86_64.AppImage", retention-days: 7}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with: {path: out, merge-multiple: true}
      - run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Ember ${TAG#v}" --generate-notes
          gh release upload "$TAG" out/* -R "$GITHUB_REPOSITORY" --clobber
